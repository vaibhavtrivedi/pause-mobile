name: PAUSE Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PAUSE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Diagnose Expo packages
        run: |
          npm ls @expo/config-plugins @expo/prebuild-config
          npm ls expo expo-router expo-linking expo-constants
          node -e "console.log(require.resolve('expo/package.json'))"
          node -e "console.log(require.resolve('expo-linking/package.json'))"
          node -e "console.log(require('expo/package.json').version)"
          node -e "console.log(require('expo-linking/package.json').version)"
          grep -n 'bundle-origin' node_modules/expo-linking/build/createURL.js || true

      - name: Validate Expo dependencies
        run: node ./node_modules/expo/bin/cli install --check  

      - name: Align Expo dependencies
        run: node ./node_modules/expo/bin/cli install --fix

      - name: Verify Expo dependencies
        run: node ./node_modules/expo/bin/cli install --check

      - name: Check project configuration
        run: |
          node ./node_modules/expo/bin/cli config --type public

      - name: Verify Expo Doctor configuration
        run: node -e "console.log(JSON.stringify(require('./package.json').expo.doctor, null, 2))"
      
      - name: Run Expo Doctor
        run: |
          npx --yes expo-doctor  

      - name: Fix Expo CLI permissions
        run: chmod +x ./node_modules/expo/bin/cli

      - name: Verify Expo authentication
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Link Expo project
        run: eas init --account vaibhavtrivedi80 --force --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
